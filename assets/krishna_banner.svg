<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" aria-label="Krishna image and parchment text">
  <title>Krishna image with Shvetashvatara Upanishad verse</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8e2"/>
      <stop offset="100%" stop-color="#f4e0c7"/>
    </linearGradient>
    <linearGradient id="photoOverlay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0.25)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </linearGradient>
    <filter id="bannerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="1580" height="780" rx="40" fill="url(#bg)" filter="url(#bannerShadow)"/>
  <rect x="40" y="40" width="750" height="720" rx="36" fill="#000" />
  <image x="40" y="40" width="750" height="720" preserveAspectRatio="xMidYMid slice" href="krishna_photo.jpg"/>
  <rect x="40" y="40" width="750" height="720" rx="36" fill="url(#photoOverlay)"/>
  <g transform="translate(840, 60)">
    <rect x="0" y="0" width="720" height="720" rx="40" fill="#f5e1b1" stroke="#d4a94f" stroke-width="8"/>
    <rect x="24" y="24" width="672" height="672" rx="32" fill="rgba(255,255,255,0.88)"/>
    <path d="M 40 60 C 120 20, 210 20, 280 60" fill="none" stroke="#d4a94f" stroke-width="6" />
    <path d="M 40 660 C 120 700, 210 700, 280 660" fill="none" stroke="#d4a94f" stroke-width="6" />
    <text x="360" y="100" font-family="'Noto Sans Devanagari', serif" font-size="40" fill="#6b3e04" text-anchor="middle" font-weight="700">श्वेताश्वतार उपनिषद्</text>
    <text x="360" y="150" font-family="'Noto Sans Devanagari', serif" font-size="32" fill="#6b3e04" text-anchor="middle">६.८</text>
    <text x="70" y="240" font-family="'Noto Sans Devanagari', serif" font-size="28" fill="#4f3103">न तस्य कार्यं करणं च विद्यते</text>
    <text x="70" y="290" font-family="'Noto Sans Devanagari', serif" font-size="28" fill="#4f3103">न तत्समश्चाभ्यधिकश्च दृश्यते।</text>
    <text x="70" y="340" font-family="'Noto Sans Devanagari', serif" font-size="28" fill="#4f3103">परास्य शक्तिर्विविधैव श्रूयते</text>
    <text x="70" y="390" font-family="'Noto Sans Devanagari', serif" font-size="28" fill="#4f3103">स्वाभाविकी ज्ञानबलक्रिया च॥</text>
    <text x="70" y="470" font-family="Inter, Arial, sans-serif" font-size="24" fill="#4f3103">У Него нет ни дела, ни причины,</text>
    <text x="70" y="510" font-family="Inter, Arial, sans-serif" font-size="24" fill="#4f3103">Ни то, ни другое не видится.</text>
    <text x="70" y="550" font-family="Inter, Arial, sans-serif" font-size="24" fill="#4f3103">Его сила превыше всего —</text>
    <text x="70" y="590" font-family="Inter, Arial, sans-serif" font-size="24" fill="#4f3103">Знание, мощь и деяния.</text>
    <text x="360" y="680" font-family="Inter, Arial, sans-serif" font-size="18" fill="#8a5d2a" text-anchor="middle">Шветашватара Упанишад 6.8 — перевод на русском</text>
  </g>
</svg>
