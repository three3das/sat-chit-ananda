<!DOCTYPE html>
<html lang="sa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Шветашватара-Упанишад 6.8</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Noto Sans Devanagari', 'Noto Serif Devanagari', serif;
    }

    .verse-container {
      background: linear-gradient(145deg, #fff9e6 0%, #fffbf0 100%);
      border: 3px solid #d4af37;
      border-radius: 20px;
      padding: 50px 60px;
      max-width: 800px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
      position: relative;
    }

    .verse-container::before {
      content: '';
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      bottom: 15px;
      border: 1px solid #d4af37;
      border-radius: 15px;
      opacity: 0.5;
    }

    .om-symbol {
      text-align: center;
      font-size: 48px;
      color: #c7941e;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
    }

    .verse-text {
      font-size: 28px;
      line-height: 1.8;
      color: #2c1810;
      text-align: center;
      margin-bottom: 30px;
      letter-spacing: 0.5px;
    }

    .verse-reference {
      text-align: center;
      font-size: 18px;
      color: #8b6f47;
      font-style: italic;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 2px solid rgba(212, 175, 55, 0.3);
    }

    .decorative-line {
      width: 100px;
      height: 2px;
      background: linear-gradient(to right, transparent, #d4af37, transparent);
      margin: 20px auto;
    }

    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Serif+Devanagari:wght@400;700&display=swap');
  </style>
</head>
<body>
  <div class="verse-container">
    <div class="om-symbol">ॐ</div>
    <div class="decorative-line"></div>
    <div class="verse-text">
      न तस्य कार्यं करणं च विद्यते<br>
      न तत्समश्चाभ्यधिकश्च दृश्यते।<br>
      परास्य शक्तिर्विविधैव श्रूयते<br>
      स्वाभाविकी ज्ञानबलक्रिया च॥
    </div>
    <div class="decorative-line"></div>
    <div class="verse-reference">
      Шветашватара-Упанишад 6.8
    </div>
  </div>
</body>
</html>
