<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Pergament with Devanagari text">
  <title>Pergament</title>
  <!-- Transparent background -->
  <rect width="100%" height="100%" fill="none"/>

  <!-- Parchment shape -->
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="50%" stop-color="#FFF0C8"/>
      <stop offset="100%" stop-color="#F7E0B0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- rolled ends -->
  <g transform="translate(0,0)">
    <rect x="80" y="60" width="1040" height="580" rx="28" fill="url(#pg)" stroke="#d4a94f" stroke-width="6" filter="url(#shadow)"/>

    <!-- subtle texture lines -->
    <g opacity="0.07" stroke="#000" stroke-width="1">
      <path d="M120 120 C 300 110, 540 120, 1080 130" fill="none"/>
      <path d="M120 160 C 300 150, 540 160, 1080 170" fill="none"/>
      <path d="M120 200 C 300 190, 540 200, 1080 210" fill="none"/>
    </g>

    <!-- decorative corners -->
    <circle cx="110" cy="110" r="8" fill="#d4a94f" />
    <circle cx="1090" cy="110" r="8" fill="#d4a94f" />
    <circle cx="110" cy="590" r="8" fill="#d4a94f" />
    <circle cx="1090" cy="590" r="8" fill="#d4a94f" />

    <!-- Devanagari text centered on parchment -->
    <text x="600" y="260" font-family="'Noto Sans Devanagari', serif" font-size="44" fill="#6b3e04" text-anchor="middle" font-weight="700">श्वेताश्वतार उपनिषद्</text>
    <text x="600" y="310" font-family="'Noto Sans Devanagari', serif" font-size="34" fill="#6b3e04" text-anchor="middle">६.८</text>

    <!-- small transliteration/credit line -->
    <text x="600" y="520" font-family="serif" font-size="18" fill="#8a5d2a" text-anchor="middle" font-style="italic">Пергамент — прозрачный фон, текст на деванагари</text>
  </g>
</svg>
